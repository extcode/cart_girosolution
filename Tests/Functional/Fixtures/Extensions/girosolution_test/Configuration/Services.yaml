services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Extcode\GirosolutionTest\EventListener\EventRecorder:
    tags:
      - name: event.listener
        identifier: 'girosolution-test--order--finish--event-recorder'
        event: Extcode\CartGirosolution\Event\Order\FinishEvent
      - name: event.listener
        identifier: 'girosolution-test--order--cancel--event-recorder'
        event: Extcode\CartGirosolution\Event\Order\CancelEvent
